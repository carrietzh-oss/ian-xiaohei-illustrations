# 花野稀泥 IP Skill 的入口元数据。
interface:
  display_name: "花野稀泥 Visual Hub"
  short_description: "完整保留小黑视觉工作流的花野稀泥双形象 Hub"
  default_prompt: "使用 $huayexini-illustrations：保留小黑 Skill 的完整模式路由、认知锚点、隐喻、Scenes、Handdrawn PPT、Prompt 与 QA，只使用花野稀泥的无头套背袋版或有头套版；如果用户没有明确指定形象，生成前必须先询问选择 A 或 B；整组图固定同一变体并优先使用最终头部参考图。"
